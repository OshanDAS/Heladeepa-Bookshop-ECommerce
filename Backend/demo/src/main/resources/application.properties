# Application Configuration
spring.application.name=demo

# Database Configuration
spring.datasource.username=${DB_USERNAME:heladeepaBP}
spring.datasource.password=${DB_PASSWORD:HBP123}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/heladeepaBP}

# Railway Production Configuration
server.port=${PORT:8080}
# Uncomment for Railway deployment
# spring.datasource.url=${RAILWAY_DB_URL}
# spring.datasource.username=${RAILWAY_DB_USERNAME}
# spring.datasource.password=${RAILWAY_DB_PASSWORD}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Email Configuration
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Logging Configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.example.demo=DEBUG

# JWT Configuration
JWT_SECRET=${JWT_SECRET}
jwt_access_expiration=${JWT_ACCESS_EXPIRATION:86400000}
jwt_refresh_expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# PayHere Configuration
payhere.merchant.id=${PAYHERE_MERCHANT_ID}
payhere.merchant.secret=${PAYHERE_MERCHANT_SECRET}