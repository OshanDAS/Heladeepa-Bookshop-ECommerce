name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clean install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Clean Allure outputs
        run: npm run clean:allure
      - name: Run Playwright e2e tests (headless CI)
        env:
          CI: true
        run: npm run test:e2e
      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-results
          npm run allure:generate:single
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-artifacts
          path: |
            frontend/allure-results
            frontend/allure-report-single
            frontend/test-results
          if-no-files-found: warn
